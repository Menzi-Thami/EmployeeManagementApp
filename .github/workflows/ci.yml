name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "EmployeeManagementApp.sln"

      - name: Build
        run: dotnet build "EmployeeManagementApp.sln" -c Release --no-restore

      - name: Test
        run: dotnet test "EmployeeManagementApp.sln" -c Release --no-build --logger "trx;LogFileName=results.trx"

      # Build/test alone never noticed that the API could not be published (NETSDK1152).
      - name: Publish EmployeeApi
        run: dotnet publish "EmployeeApi/EmployeeApi.csproj" -c Release --no-restore -o "${{ runner.temp }}/employeeapi"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
