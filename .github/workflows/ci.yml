name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "EmployeeManagementApp/EmployeeManagementApp.sln"

      - name: Build
        run: dotnet build "EmployeeManagementApp/EmployeeManagementApp.sln" -c Release --no-restore

      - name: Test
        run: dotnet test "EmployeeManagementApp/EmployeeManagementApp.sln" -c Release --no-build --logger "trx;LogFileName=results.trx"

      # EmployeeManagementApp.API is deliberately not in the solution, so the
      # steps above never touch it. Build it explicitly or it rots unnoticed.
      - name: Build EmployeeManagementApp.API (outside the solution)
        run: dotnet build EmployeeManagementApp/EmployeeManagementApp.API.csproj -c Release

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
